# GPU backend — self-deployed open-source models (competition-compliant).
# Every component (embed / rewrite / rerank / generate) runs on a Vertex AI
# Online Endpoint backed by GPU:
#   • embed      : Qwen3-Embedding-8B  → 4096-dim vectors
#   • llm/rerank : Gemma-3-12B-it      → rewrite + whole-pool rerank + generate
#
# This is one of TWO parallel configs that behave identically and differ ONLY in
# the models used; the other is config_vertex.yaml (Gemini). Secrets come from
# env / .env (see .env.example) — never commit them.
backend: gpu

qdrant:
  host: localhost                # local Qdrant; leave `url` unset for local
  port: 6333
  collection: legal_vn_garden    # tên cũ — giữ nguyên để khớp collection đã embed
                                 # trên Qdrant (đổi tên = phải re-embed ~113k điều)
  vector_size: 4096              # Qwen3-Embedding-8B dim (must == embedding.dimension)
  distance: Cosine

# Self-deployed GPU endpoints endpoints (OpenAI-compatible vLLM serving).
gpu:
  # Embed (Qwen3) — dedicated TEI :predict endpoint.
  embed_endpoint_id: ${GPU_EMBED_ENDPOINT_ID}
  embed_model: Qwen3-Embedding-8B
  embed_dns: ${GPU_EMBED_DNS}        # dedicated domain (rotates on redeploy)
  embed_region: asia-northeast1
  # LLM (Gemma 3 12B-it) — dedicated OpenAI endpoint. Serves rewrite + rerank + generate.
  llm_endpoint_id: ${GPU_LLM_ENDPOINT_ID}
  llm_model: google/gemma-3-12b-it      # exact vLLM served name
  llm_dns: ${GPU_LLM_DNS}            # dedicated domain (rotates on redeploy)
  project_id: ${GCP_PROJECT}
  region: asia-southeast1               # LLM region (embed lives in embed_region)
  max_retries: 3
  timeout: 120

embedding:
  dimension: 4096                # Qwen3-Embedding-8B (must == qdrant.vector_size)
  task_type: RETRIEVAL_DOCUMENT
  query_task_type: RETRIEVAL_QUERY
  batch_size: 32

reranker:
  temperature: 0.0

retrieval:
  top_k_dense: 240       # per dense query (rewritten + topic); buffer over fusion
  top_k_bm25: 240        # per BM25 query; buffer over fusion
  top_k_fusion: 200      # fused candidate pool (recall@200 — chosen pool size)
  top_k_rerank: 6        # final cited articles
  rrf_k: 60

generator:
  temperature: 0.1
  max_tokens: 3000
  top_p: 0.9
  max_articles: 6        # context cap into generate; ALIGNED with top_k_rerank
