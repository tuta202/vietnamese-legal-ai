# Vertex AI / Gemini backend.
#
# This is one of TWO parallel configs that behave identically and differ ONLY in
# the models used; the other is config_gpu.yaml (self-deployed Qwen3 + Gemma).
# The retrieval / reranker / generator tuning below is kept IN SYNC with
# config_gpu.yaml — only the model-bound fields (backend, qdrant collection +
# vector_size, models, embedding.dimension) change. Secrets come from env / .env.
backend: vertex_ai

qdrant:
  url: ${QDRANT_URL}             # resolved from env / .env (NEVER commit secrets)
  api_key: ${QDRANT_API_KEY}     # resolved from env / .env (NEVER commit secrets)
  collection: legal_vn_vertex
  vector_size: 3072
  distance: Cosine

# Chat-LLM endpoint (used by query rewriter, generator, LLM reranker). Kept under
# the `vllm` key for schema parity with the shared base classes — here it points
# at Gemini, not a vLLM server.
vllm:
  model: gemini-2.5-flash-lite
  gcp_project: ${GCP_PROJECT}    # empty → GOOGLE_API_KEY env var is used instead
  gcp_location: us-central1

models:
  embedder: gemini-embedding-001
  reranker: gemini-2.5-flash-lite

embedding:
  dimension: 3072                # gemini-embedding-001 max quality
  task_type: RETRIEVAL_DOCUMENT
  query_task_type: RETRIEVAL_QUERY
  batch_size: 50

reranker:
  temperature: 0.0

# IN SYNC with config_gpu.yaml — keep these identical across both backends.
retrieval:
  top_k_dense: 240       # buffer over fusion
  top_k_bm25: 240        # buffer over fusion
  top_k_fusion: 200      # fused candidate pool (recall@200 — chosen pool size)
  top_k_rerank: 6
  rrf_k: 60

generator:
  temperature: 0.1
  max_tokens: 3000
  top_p: 0.9
  max_articles: 6
