# Vertex AI / Gemini backend — SAME schema as retrieval/config.yaml.
# Only model names + backend differ; secrets come from env / .env (see .env.example).
backend: vertex_ai

qdrant:
  url: ${QDRANT_URL}             # resolved from env / .env (NEVER commit secrets)
  api_key: ${QDRANT_API_KEY}     # resolved from env / .env (NEVER commit secrets)
  collection: legal_vn_vertex
  vector_size: 3072
  distance: Cosine

# Chat-LLM endpoint (used by query rewriter, generator, LLM reranker).
vllm:
  model: gemini-2.5-flash-lite
  gcp_project: ${GCP_PROJECT}    # empty → GOOGLE_API_KEY env var is used instead
  gcp_location: us-central1

models:
  embedder: gemini-embedding-001
  reranker: gemini-2.5-flash-lite

embedding:
  dimension: 3072                # gemini-embedding-001 max quality
  task_type: RETRIEVAL_DOCUMENT
  query_task_type: RETRIEVAL_QUERY
  batch_size: 50

reranker:
  temperature: 0.0

retrieval:
  # Candidate pool widened for the ~113k-article corpus (was 20/20/20 at 1044
  # articles). With ~100x more competing documents, the relevant article needs a
  # wider net to survive into reranking. The Vertex reranker scores the whole
  # pool in ONE batched LLM call, so a larger top_k_fusion is cheap.
  # NOTE: dense retrieval only benefits once Qdrant is re-embedded with the new
  # corpus — until then the `legal_vn_vertex` collection still holds 1044 points:
  #   python setup_qdrant_cloud.py --config config_vertex.yaml \
  #          --corpus corpus/data/corpus.json --force
  top_k_dense: 50
  top_k_bm25: 50
  top_k_fusion: 40   # candidates sent to the (single batched) LLM reranker
  top_k_rerank: 7    # final cited articles — fixed; prefer over-citing over
                     # missing (recall, F2-weighted 4x). 150-sample maxes at 3
                     # but the private test set may need more.
  rrf_k: 60

generator:
  temperature: 0.1
  max_tokens: 3000
  top_p: 0.9
  max_articles: 7
