# Self-deployed GPU backend using the cleaned as-of corpus.
# This collection must be built with Qwen3-Embedding-8B; it cannot reuse the
# 3072-dimensional Gemini collection from config_vertex_clean.yaml.
backend: gpu

qdrant:
  url: ${QDRANT_URL}
  api_key: ${QDRANT_API_KEY}
  host: localhost
  port: 6333
  collection: legal_vn_qwen3_asof_20260301_v1
  vector_size: 4096
  distance: Cosine

gpu:
  embed_endpoint_id: ${GPU_EMBED_ENDPOINT_ID}
  embed_model: Qwen3-Embedding-8B
  embed_dns: ${GPU_EMBED_DNS}
  embed_region: asia-northeast1
  llm_endpoint_id: ${GPU_LLM_ENDPOINT_ID}
  llm_model: google/gemma-3-12b-it
  llm_dns: ${GPU_LLM_DNS}
  project_id: ${GCP_PROJECT}
  region: asia-southeast1
  max_retries: 3
  timeout: 120

bge:
  endpoint_id: ${GPU_BGE_ENDPOINT_ID}
  dns: ${GPU_BGE_DNS}
  region: asia-northeast1
  project_id: ${GCP_PROJECT}
  max_texts: 32
  timeout: 120
  max_retries: 3

models:
  embedder: Qwen3-Embedding-8B
  reranker: BAAI/bge-reranker-v2-m3

embedding:
  dimension: 4096
  task_type: RETRIEVAL_DOCUMENT
  query_task_type: RETRIEVAL_QUERY
  batch_size: 32

reranker:
  temperature: 0.0

retrieval:
  top_k_dense: 240
  top_k_bm25: 240
  top_k_fusion: 200
  top_k_rerank: 6
  rrf_k: 60
  enable_intent_retrieval: true
  intent_top_k_bm25: 50
  intent_top_k_dense: 50
  intent_top_k_rrf: 10

generator:
  temperature: 0.0
  max_tokens: 3000
  top_p: 0.9
  max_articles: 0
  content_max_chars: 2400
  total_content_max_chars: 48000
