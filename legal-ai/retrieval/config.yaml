backend: vllm

qdrant:
  host: localhost
  port: 6333
  collection: legal_vn

vllm:
  base_url: http://localhost:8000/v1
  model: Qwen/Qwen2.5-7B-Instruct

models:
  embedder: Qwen/Qwen3-Embedding-8B
  reranker: Qwen/Qwen3-Reranker-4B

retrieval:
  # Candidate pool widened for the ~113k-article corpus (was 20/20/20 at 1044).
  # Same rationale as config_vertex.yaml. The Qwen cross-encoder reranker scores
  # each of the top_k_fusion candidates, so the pool also drives rerank compute.
  top_k_dense: 50
  top_k_bm25: 50
  top_k_fusion: 40
  top_k_rerank: 7    # final cited articles — fixed; prefer over-citing over missing
  rrf_k: 60

generator:
  temperature: 0.3
  max_tokens: 3000
  top_p: 0.9
  max_articles: 7
