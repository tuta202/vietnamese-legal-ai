# Vertex AI / Gemini backend using the cleaned legal corpus.
# New Qdrant collection; does not overwrite previous collections.
backend: vertex_ai

qdrant:
  url: ${QDRANT_URL}
  api_key: ${QDRANT_API_KEY}
  collection: legal_vn_vertex_asof_20260301_v1
  vector_size: 3072
  distance: Cosine

vllm:
  model: gemini-2.5-flash-lite
  gcp_project: ${GCP_PROJECT}
  gcp_location: us-central1

models:
  embedder: gemini-embedding-001
  reranker: gemini-2.5-flash-lite

embedding:
  dimension: 3072
  task_type: RETRIEVAL_DOCUMENT
  query_task_type: RETRIEVAL_QUERY
  batch_size: 50

reranker:
  temperature: 0.0

retrieval:
  top_k_dense: 240
  top_k_bm25: 240
  top_k_fusion: 200
  top_k_rerank: 6
  rrf_k: 60
  enable_intent_retrieval: true
  intent_top_k_bm25: 50
  intent_top_k_dense: 50
  intent_top_k_rrf: 10

generator:
  temperature: 0.1
  max_tokens: 3000
  top_p: 0.9
  max_articles: 6

bge:
  endpoint_id: ${GPU_BGE_ENDPOINT_ID}
  dns: ${GPU_BGE_DNS}
  region: asia-northeast1
  project_id: ${GCP_PROJECT}
  max_texts: 32
